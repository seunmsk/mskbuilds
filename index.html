<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSK Builds</title>
<meta name="description" content="MSK OS: every product and game Seun Mosaku has put on the internet, in one place.">
<meta property="og:title" content="MSK Builds">
<meta property="og:description" content="Every product and game Seun Mosaku has put on the internet.">
<meta property="og:url" content="https://mskbuilds.app">
<meta name="theme-color" content="#284E24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23284E24'/%3E%3Cpath d='M15 45V19h6l11 14 11-14h6v26h-6V30L32 42 21 30v15z' fill='%23fff'/%3E%3Ccircle cx='50' cy='14' r='5' fill='%23E8F57A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: playful-futuristic, confident, few words
   IDEA: the site is an operating system, MSK OS; every build is an app on its home screen
   PICTURE: army-green night sky, alive: twinkling stars, a hovering UFO with a pulsing beam, hills below
   COLOUR and TYPE: army green field, khaki support, beam lime accent; Unbounded display, Geist text
   LAYOUT: status bar, name, widgets + app grid in one screen; window opens over it; quiet footer */
:root{
  --cobalt:#284E24; --deep:#15290F; --lilac:#D9D3A8; --pink:#E8F57A; --white:#fff;
  --glass:rgba(16,34,14,.5); --edge:rgba(232,245,122,.28);
}
*{box-sizing:border-box;min-width:0;margin:0;padding:0}
html{color-scheme:dark}
body{background:radial-gradient(120% 90% at 50% 0%,#33602D 0%,#284E24 45%,#1A3517 100%) fixed var(--cobalt);color:var(--white);font:16px/1.55 "Geist",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:10px}

/* the living sky */
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.star{fill:#F4F1D0;animation:tw var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.shoot{position:absolute;width:120px;height:2px;background:linear-gradient(90deg,transparent,#F4F1D0);border-radius:2px;opacity:0;transform:rotate(-20deg)}
.shoot.go{animation:shoot 1.1s ease-out}
@keyframes shoot{0%{opacity:0;translate:0 0}15%{opacity:1}100%{opacity:0;translate:-340px 125px}}
#ufo{transform-box:view-box}
.beam{animation:beam 2.6s ease-in-out infinite;transform-origin:top center;transform-box:fill-box}
@keyframes beam{0%,100%{opacity:.35;transform:scaleX(.85)}50%{opacity:.75;transform:scaleX(1)}}
.lights circle{animation:blink 1.2s steps(1) infinite}
.lights circle:nth-child(2){animation-delay:.3s}.lights circle:nth-child(3){animation-delay:.6s}.lights circle:nth-child(4){animation-delay:.9s}
@keyframes blink{0%,49%{fill:#E8F57A}50%,100%{fill:#5C6630}}
.mote{fill:#E8F57A;animation:rise var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes rise{from{transform:translateY(0);opacity:0}20%{opacity:.9}to{transform:translateY(-150px);opacity:0}}

/* the desktop */
.desk{position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;isolation:isolate}


.status{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px max(4vw,16px);font-size:14px;font-weight:500}
.logo{display:flex;align-items:center;gap:10px;font-family:"Unbounded",system-ui,sans-serif;font-weight:700;font-size:15px;text-decoration:none}
.logo svg{width:28px;height:28px}
.status .right{display:flex;gap:18px;align-items:center;color:var(--lilac)}
.status .right b{color:var(--white);font-weight:600;font-variant-numeric:tabular-nums}
@media(max-width:520px){.status .hide{display:none}}

.home{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:clamp(24px,5vh,56px) max(4vw,16px) 64px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(28px,5vw,72px);align-items:center}
@media(max-width:900px){.home{grid-template-columns:1fr}}

h1{font-family:"Unbounded",system-ui,sans-serif;font-weight:800;font-size:clamp(40px,6.2vw,80px);line-height:1;letter-spacing:-.03em;text-wrap:balance}
.intro p{margin-top:22px;font-size:17px;max-width:30em;color:#E6E9FF}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px;max-width:440px}
.widget{background:var(--glass);border:1px solid var(--edge);border-radius:22px;padding:16px 18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.widget small{display:block;color:var(--lilac);font-size:13px}
.widget .clock{font-family:"Unbounded",system-ui,sans-serif;font-weight:700;font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.widget ul{list-style:none;margin-top:6px;font-size:14px;display:grid;gap:3px}
.widget li{display:flex;justify-content:space-between;gap:8px}
.widget li b{font-variant-numeric:tabular-nums}

/* app grid */
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(18px,3vw,34px) clamp(12px,2.4vw,28px);padding:clamp(20px,3vw,34px);background:rgba(14,30,12,.55);border:1px solid var(--edge);border-radius:36px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
@media(max-width:420px){.apps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.app{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-size:14px;font-weight:500;line-height:1.25;border-radius:22px;padding:4px;
  animation:pop .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*70ms + 200ms)}
.app:focus-visible{outline:3px solid var(--pink);outline-offset:4px}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.6)}}
.icon{position:relative;width:100%;max-width:92px;aspect-ratio:1;border-radius:26%;display:grid;place-items:center;
  box-shadow:0 14px 26px -10px rgba(10,14,2,.8),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .2s}
.icon svg{width:58%;height:58%}
.app:hover .icon{transform:translateY(-4px) rotate(-3deg)}
.app:active .icon{transform:scale(.94)}
.badge{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;border:3px solid var(--deep)}
.badge.live{background:#4BE38A}.badge.pilot{background:#FFD23F}.badge.building{background:#9FB4FF}.badge.paused{background:#8A93C9}
.legend{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:13px;color:var(--lilac);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* window */
.scrim{position:fixed;inset:0;background:rgba(8,22,8,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.win{width:min(520px,100%);background:#fff;color:#1F240C;border-radius:28px;overflow:hidden;box-shadow:0 40px 80px -20px rgba(10,14,0,.7);transform:translateY(24px) scale(.96);transition:transform .25s cubic-bezier(.2,1.2,.4,1)}
.scrim.open .win{transform:none}
.win-top{display:flex;align-items:center;gap:16px;padding:22px 22px 0}
.win-top .icon{width:72px;max-width:none;flex:none;box-shadow:none}
.win-top h2{font-family:"Unbounded",system-ui,sans-serif;font-weight:700;font-size:24px;line-height:1.1;letter-spacing:-.01em}
.win-top small{display:block;color:#5E6440;font-size:14px;margin-top:4px}
.win-body{padding:18px 22px 22px}
.win-body p{font-size:16.5px;color:#2E3418}
.stage{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;font-weight:600;background:#F0EEDC;padding:6px 12px;border-radius:999px}
.stage i{width:10px;height:10px;border-radius:50%}
.win-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:16px;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.btn.go{background:var(--cobalt);color:#fff;flex:1}
.btn.go:hover{background:var(--deep)}
.btn.off{background:#F0EEDC;color:#5E6440;flex:1;cursor:default}
.btn.close{background:#fff;color:#1F240C;box-shadow:inset 0 0 0 2px #D9D3A8}

footer{background:#12250F;padding:28px max(4vw,16px)}
footer .in{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:14px 28px;flex-wrap:wrap;font-size:15px;color:var(--lilac)}
footer nav{display:flex;gap:20px;flex-wrap:wrap}
footer a{color:#fff;text-underline-offset:4px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <svg id="skySvg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMin meet">
    <defs>
      <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8F57A" stop-opacity=".85"/><stop offset="1" stop-color="#E8F57A" stop-opacity="0"/></linearGradient>
      <radialGradient id="domeG" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#F7FBD8"/><stop offset=".6" stop-color="#B8D06A" stop-opacity=".85"/><stop offset="1" stop-color="#6E8A2A" stop-opacity=".7"/></radialGradient>
      <linearGradient id="hullG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9E6CF"/><stop offset=".5" stop-color="#9C9A7E"/><stop offset="1" stop-color="#4E4F38"/></linearGradient>
      <radialGradient id="moonG" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#F4F1D0"/><stop offset="1" stop-color="#C9C49A"/></radialGradient>
    </defs>
    <g id="stars"></g>
    <g id="moon"><circle cx="860" cy="150" r="46" fill="url(#moonG)" opacity=".9"/>
    <circle cx="845" cy="140" r="9" fill="#BDB78A" opacity=".6"/><circle cx="874" cy="168" r="6" fill="#BDB78A" opacity=".6"/></g>
    <g id="ufo">
      <polygon class="beam" points="-34,10 34,10 120,330 -120,330" fill="url(#beamG)"/>
      <g id="motes"></g>
      <ellipse cx="0" cy="-8" rx="34" ry="26" fill="url(#domeG)"/>
      <ellipse cx="0" cy="6" rx="86" ry="20" fill="url(#hullG)"/>
      <ellipse cx="0" cy="0" rx="86" ry="7" fill="#F4F1D0" opacity=".35"/>
      <g class="lights"><circle cx="-56" cy="10" r="5"/><circle cx="-20" cy="15" r="5"/><circle cx="20" cy="15" r="5"/><circle cx="56" cy="10" r="5"/></g>
    </g>
    <g id="hills"><path d="M0 880 C120 830 220 860 330 835 S560 800 680 845 S880 820 1000 840 V1000 H0z" fill="#1E3B1B"/>
    <path d="M0 930 C160 900 260 925 420 905 S700 890 820 915 S940 905 1000 912 V1000 H0z" fill="#12250F"/></g>
  </svg>
  <span class="shoot" id="shoot"></span>
</div>
<main class="desk">
  

  <div class="status">
    <a class="logo" href="/" aria-label="MSK Builds home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#fff"/><path d="M15 45V19h6l11 14 11-14h6v26h-6V30L32 42 21 30v15z" fill="#284E24"/><circle cx="50" cy="14" r="5" fill="#C0D346"/></svg>
      MSK OS
    </a>
    <div class="right">
      <span class="hide">Lagos, Nigeria</span>
      <span><b id="appCount">8</b> apps</span>
    </div>
  </div>

  <div class="home">
    <div class="intro">
      <h1>Seun builds on the internet.</h1>
      <p>This is my home screen. Every product and game I've put online lives here. Tap an app to see what it does and open it.</p>
      <div class="widgets">
        <div class="widget">
          <small>Lagos time</small>
          <div class="clock" id="clock">--:--</div>
          <small id="date">&nbsp;</small>
        </div>
        <div class="widget">
          <small>App status</small>
          <ul id="tally"></ul>
        </div>
      </div>
    </div>

    <div class="apps" id="apps" role="list" aria-label="Apps"></div>
  </div>
</main>

<footer>
  <div class="in">
    <span>© <span id="yr">2026</span> MSK Builds. Built in Lagos by Seun Mosaku.</span>
    <nav aria-label="Contact">
      <a href="mailto:hello@mskbuilds.app">hello@mskbuilds.app</a>
      <a href="https://github.com/seunmsk" rel="noopener">GitHub</a>
    </nav>
  </div>
</footer>

<div class="scrim" id="scrim" aria-hidden="true">
  <div class="win" role="dialog" aria-modal="true" aria-labelledby="wName">
    <div class="win-top">
      <div class="icon" id="wIcon"></div>
      <div><h2 id="wName"></h2><small id="wTag"></small></div>
    </div>
    <div class="win-body">
      <p id="wDesc"></p>
      <span class="stage" id="wStage"></span>
      <div class="win-actions" id="wActions"></div>
    </div>
  </div>
</div>

<script>
{
/* ---------- EDIT YOUR APPS HERE ----------
   stage: live | pilot | building | paused
   url:   "" if there's no public link yet
   bg:    the icon's colour */
const apps = [
  {name:"Eppcheck", tag:"Physical verification", stage:"live", url:"https://www.eppcheck.com", bg:"#284E24",
   desc:"Book someone nearby to physically check an address, property or item for you. You get photos and a GPS-stamped report.",
   svg:`<circle cx="32" cy="32" r="22" fill="none" stroke="#fff" stroke-width="7"/><path d="M20 33l8 8 17-18" fill="none" stroke="#C0D346" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`},
  {name:"TrailConstruct", tag:"Construction tracking", stage:"pilot", url:"https://trailconstruct.com", bg:"#16224A",
   desc:"Track a building project stage by stage. Engineers send updates, developers approve them and investors get clean reports.",
   svg:`<path d="M8 50 C22 46 20 30 32 28 S44 14 56 12" fill="none" stroke="#F2A93B" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 9"/><circle cx="8" cy="50" r="5" fill="#fff"/><circle cx="32" cy="28" r="5" fill="#fff"/><circle cx="56" cy="12" r="5" fill="#F2A93B"/>`},
  {name:"Game Night", tag:"Party games on your phone", stage:"live", url:"https://gamenight.mskbuilds.app", bg:"#FF5FA2",
   desc:"One link and everyone plays on their own phone. Naija party games for when the whole squad is in one room.",
   svg:`<rect x="10" y="10" width="44" height="44" rx="11" fill="#fff"/><circle cx="22" cy="22" r="4.5" fill="#FF5FA2"/><circle cx="42" cy="22" r="4.5" fill="#FF5FA2"/><circle cx="32" cy="32" r="4.5" fill="#FF5FA2"/><circle cx="22" cy="42" r="4.5" fill="#FF5FA2"/><circle cx="42" cy="42" r="4.5" fill="#FF5FA2"/>`},
  {name:"Owambe Survivor", tag:"Arcade party game", stage:"live", url:"https://owambe.mskbuilds.app", bg:"#FFB800",
   desc:"Catch the naira, dodge the aunties asking when you're getting married, and win the dance-off.",
   svg:`<path d="M10 30c4-14 40-14 44 0-8-4-36-4-44 0z" fill="#7A1FA2"/><path d="M14 30c6 6 30 6 36 0" fill="none" stroke="#7A1FA2" stroke-width="5" stroke-linecap="round"/><rect x="16" y="40" width="20" height="11" rx="2" fill="#2E8B57" transform="rotate(-12 26 45)"/><rect x="30" y="42" width="20" height="11" rx="2" fill="#2E8B57" transform="rotate(10 40 47)"/>`},
  {name:"Close of Work", tag:"Lagos office game", stage:"live", url:"https://closeofwork.com", bg:"#FF6B3D",
   desc:"Pick a Lagos job and race the clock to closing time without losing your mind.",
   svg:`<circle cx="32" cy="34" r="21" fill="#fff"/><path d="M32 21v13l9 6" fill="none" stroke="#FF6B3D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="6" width="12" height="6" rx="2" fill="#fff"/>`},
  {name:"Zuzu", tag:"Personal AI assistant", stage:"building", url:"", bg:"#1E2A4A",
   desc:"My own Jarvis. An assistant on my phone and laptop that remembers everything I'm working on.",
   svg:`<circle cx="32" cy="32" r="18" fill="#C9D2FF"/><circle cx="32" cy="32" r="9" fill="#3B5BDB"/><circle cx="36" cy="28" r="3" fill="#fff"/><circle cx="32" cy="32" r="25" fill="none" stroke="#FF5FA2" stroke-width="2.5" stroke-dasharray="4 6"/>`},
  {name:"carshare.africa", tag:"Fuel-sharing commutes", stage:"paused", url:"https://carshare.africa", bg:"#00A3A3",
   desc:"Share a ride and split the fuel with people going your way in Lagos.",
   svg:`<path d="M10 40v-8l6-12h32l6 12v8z" fill="#fff"/><path d="M20 23h24l4 9H16z" fill="#00A3A3"/><circle cx="20" cy="42" r="6" fill="#1F240C"/><circle cx="44" cy="42" r="6" fill="#1F240C"/>`}
];

const stages = {
  live:{label:"Live", note:"Live: you can use it now", c:"#4BE38A"},
  pilot:{label:"Pilot", note:"Pilot: live with early users", c:"#FFD23F"},
  building:{label:"Building", note:"Building: not public yet", c:"#9FB4FF"},
  paused:{label:"Paused", note:"Paused: on hold for now", c:"#8A93C9"}
};
const esc = s => String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const iconHTML = a => `<svg viewBox="0 0 64 64" aria-hidden="true">${a.svg}</svg>`;

const grid = document.getElementById("apps");
grid.innerHTML = apps.map((a,i)=>`
  <button class="app" role="listitem" style="--i:${i}" data-i="${i}" aria-label="${esc(a.name)}, ${stages[a.stage].label}">
    <span class="icon" style="background:${a.bg}">${iconHTML(a)}<span class="badge ${a.stage}"></span></span>
    <span>${esc(a.name)}</span>
  </button>`).join("") +
  `<div class="legend">${Object.values(stages).map(s=>`<span><i style="background:${s.c}"></i>${s.label}</span>`).join("")}</div>`;

document.getElementById("appCount").textContent = apps.length;
document.getElementById("tally").innerHTML = Object.entries(stages)
  .map(([k,s])=>[s.label, apps.filter(a=>a.stage===k).length])
  .filter(([,n])=>n>0)
  .map(([l,n])=>`<li><span>${l}</span><b>${n}</b></li>`).join("");
document.getElementById("yr").textContent = new Date().getFullYear();

/* Lagos clock */
const clock = document.getElementById("clock"), date = document.getElementById("date");
const tick = () => {
  const now = new Date();
  clock.textContent = now.toLocaleTimeString("en-GB",{timeZone:"Africa/Lagos",hour:"2-digit",minute:"2-digit"});
  date.textContent = now.toLocaleDateString("en-GB",{timeZone:"Africa/Lagos",weekday:"long",day:"numeric",month:"short"});
};
tick(); setInterval(tick, 10000);


/* living sky */
const NS="http://www.w3.org/2000/svg", calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const starsG=document.getElementById("stars");
const sky=document.getElementById("skySvg"), hills=document.getElementById("hills"), moon=document.getElementById("moon");
let VH=1000, S=1;
const fit=()=>{VH=1000*innerHeight/innerWidth;S=innerWidth<600?1.9:1;
  sky.setAttribute("viewBox",`0 0 1000 ${VH.toFixed(1)}`);
  hills.setAttribute("transform",`translate(0 ${(VH-1000*Math.min(1,S===1?1:.55)).toFixed(1)}) scale(1 ${S===1?1:.55})`);
  moon.setAttribute("transform",S===1?"translate(-150 -55)":"translate(-60 40) scale(1.6) translate(-320 -60)");};
fit(); addEventListener("resize",fit);
for(let i=0;i<110;i++){const c=document.createElementNS(NS,"circle");
  c.setAttribute("cx",Math.random()*1000);c.setAttribute("cy",Math.random()*Math.max(VH,1000)*.85);c.setAttribute("r",Math.random()*1.8+.5);
  c.setAttribute("class","star");c.style.setProperty("--d",(2+Math.random()*4)+"s");c.style.setProperty("--dl",(-Math.random()*5)+"s");starsG.appendChild(c);}
const motes=document.getElementById("motes");
for(let i=0;i<10;i++){const c=document.createElementNS(NS,"circle");
  c.setAttribute("cx",(Math.random()-.5)*140);c.setAttribute("cy",200+Math.random()*120);c.setAttribute("r",Math.random()*2.5+1);
  c.setAttribute("class","mote");c.style.setProperty("--d",(2.5+Math.random()*2.5)+"s");c.style.setProperty("--dl",(-Math.random()*4)+"s");motes.appendChild(c);}
const ufo=document.getElementById("ufo");
let px=null, ux=500, t0=performance.now();
addEventListener("pointermove",e=>{px=e.clientX/innerWidth*1000;},{passive:true});
const fly=now=>{
  const t=(now-t0)/1000;
  const wander=500+(S===1?330:280)*Math.sin(t*.18)+90*Math.sin(t*.53);
  const target=px==null?wander:(wander*.5+px*.5);
  ux+=(target-ux)*.02;
  const uy=VH*(S===1?.2:.3)+28*Math.sin(t*.9)+40*Math.sin(t*.21);
  const tilt=Math.max(-12,Math.min(12,(target-ux)*.08));
  ufo.setAttribute("transform",`translate(${ux.toFixed(1)} ${uy.toFixed(1)}) rotate(${tilt.toFixed(2)}) scale(${S})`);
  if(!calm) requestAnimationFrame(fly);
};
requestAnimationFrame(fly);
const shoot=document.getElementById("shoot");
const shootStar=()=>{shoot.style.left=(40+Math.random()*55)+"%";shoot.style.top=(5+Math.random()*30)+"%";
  shoot.classList.remove("go");void shoot.offsetWidth;shoot.classList.add("go");setTimeout(shootStar,5000+Math.random()*7000);};
if(!calm) setTimeout(shootStar,2500);

/* app window */
const scrim = document.getElementById("scrim");
let lastBtn = null;
const openApp = i => {
  const a = apps[i], s = stages[a.stage];
  const ic = document.getElementById("wIcon");
  ic.style.background = a.bg; ic.innerHTML = iconHTML(a);
  document.getElementById("wName").textContent = a.name;
  document.getElementById("wTag").textContent = a.tag;
  document.getElementById("wDesc").textContent = a.desc;
  document.getElementById("wStage").innerHTML = `<i style="background:${s.c}"></i>${esc(s.note)}`;
  const host = a.url.replace(/^https?:\/\/(www\.)?/,"");
  document.getElementById("wActions").innerHTML =
    (a.url ? `<a class="btn go" href="${esc(a.url)}" rel="noopener">Open ${esc(host)}</a>` : `<span class="btn off">Not public yet</span>`) +
    `<button class="btn close" type="button" id="wClose">Close</button>`;
  document.getElementById("wClose").addEventListener("click", closeApp);
  scrim.classList.add("open"); scrim.setAttribute("aria-hidden","false");
  (scrim.querySelector(".go") || document.getElementById("wClose")).focus();
};
const closeApp = () => {
  scrim.classList.remove("open"); scrim.setAttribute("aria-hidden","true");
  if (lastBtn) lastBtn.focus();
};
grid.addEventListener("click", e => {
  const b = e.target.closest(".app"); if (!b) return;
  lastBtn = b; openApp(+b.dataset.i);
});
scrim.addEventListener("click", e => { if (e.target === scrim) closeApp(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && scrim.classList.contains("open")) closeApp(); });
}
</script>
</body>
